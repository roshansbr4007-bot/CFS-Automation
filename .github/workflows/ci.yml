name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-secret
  DATABASE_URL: postgres://cfs_owner:cfs_owner@localhost:5432/cfs_ops

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: cfs_ops, POSTGRES_USER: cfs_owner, POSTGRES_PASSWORD: cfs_owner }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfs_owner" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file schema.yml
      - run: pytest --cov
      - uses: actions/upload-artifact@v4
        with: { name: openapi-schema, path: backend/schema.yml }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: cfs_ops, POSTGRES_USER: cfs_owner, POSTGRES_PASSWORD: cfs_owner }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfs_owner" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: Ci-Admin-Ledger-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements/dev.txt
          python manage.py migrate
          INITIAL_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" python manage.py create_initial_admin --email "$E2E_ADMIN_EMAIL" --no-input
          python manage.py runserver 8000 &
      - name: Start frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx vite build
          npx vite preview --port 5173 &
          npx playwright install --with-deps chromium
          npx wait-on -t 60000 http://localhost:5173 http://localhost:8000/api/v1/health/ || sleep 10
      - working-directory: frontend
        run: npx playwright test
